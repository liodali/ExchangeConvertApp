name: Android Release

# Play Store pipeline — tag `app-v*` (e.g. app-v1.0.0) →
#   signed release AAB → Google Play internal testing track.
#
# Required repository secrets (see docs/play-release.md):
#   ANDROID_KEYSTORE_BASE64   — base64 of the release .jks keystore
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
#   PLAY_SERVICE_ACCOUNT_JSON — Play Console service account JSON
#
# Signing: the runner materializes key.properties from the keystore
# secrets (same file format local builds use) — app/build.gradle.kts
# loads it at configuration time. Missing secrets → unsigned AAB
# artifact, Play upload skipped.
on:
  push:
    tags:
      - "app-v*"
  workflow_dispatch:

jobs:
  release:
    name: Build & upload AAB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Detect secrets
        id: secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PLAY_SA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then echo "keystore=true" >> "$GITHUB_OUTPUT"; fi
          if [ -n "$PLAY_SA" ]; then echo "play=true" >> "$GITHUB_OUTPUT"; fi

      - name: Materialize signing (keystore + key.properties)
        if: steps.secrets.outputs.keystore == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > "$HOME/release.keystore"
          # The build reads key.properties at configuration time (same file
          # as local builds use) — CI materializes it from secrets here.
          {
            echo "KEYSTORE_PATH=$HOME/release.keystore"
            echo "KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
            echo "KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}"
            echo "KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}"
          } > key.properties

      - name: Derive version from tag
        run: |
          # Tag scheme: app-vX.Y.Z+BUILD[-dev]  (e.g. app-v1.0.1+42, app-v1.0.1+43-dev)
          # Also accepts dev before the build: app-v1.0.1-dev+44
          #   versionName = X.Y.Z ("-dev" appended when marked)
          #   versionCode = BUILD (Play requires strictly increasing)
          # No +BUILD → fall back to the run number with a warning.
          TAG="${GITHUB_REF_NAME#app-v}"
          if [ "$TAG" = "$GITHUB_REF_NAME" ]; then
            # workflow_dispatch / non-tag: dev build from the run number
            VERSION_NAME="1.0.0-dev.$GITHUB_RUN_NUMBER"
            VERSION_CODE="$GITHUB_RUN_NUMBER"
          else
            BASE="${TAG%%+*}"
            IS_DEV=false
            if [[ "$BASE" == *"-dev" ]]; then IS_DEV=true; BASE="${BASE%-dev}"; fi
            if [[ "$TAG" == *"-dev" ]]; then IS_DEV=true; fi
            CODE=""
            if [[ "$TAG" == *"+"* ]]; then
              CODE="${TAG#*+}"
              CODE="${CODE%-dev}"
            fi
            if ! [[ "$CODE" =~ ^[0-9]+$ ]]; then
              echo "::warning::tag '$GITHUB_REF_NAME' has no +BUILD — using run number as versionCode"
              CODE="$GITHUB_RUN_NUMBER"
            fi
            if [ "$CODE" -gt 2100000000 ]; then
              echo "::error::versionCode $CODE exceeds Play's 2100000000 limit"; exit 1
            fi
            if [ "$IS_DEV" = true ]; then
              VERSION_NAME="$BASE-dev"
            else
              VERSION_NAME="$BASE"
            fi
            VERSION_CODE="$CODE"
          fi
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "release: versionName=$VERSION_NAME versionCode=$VERSION_CODE"

      - name: Build release AAB
        run: |
          ./gradlew :app:bundleRelease \
            -PversionCode="$VERSION_CODE" \
            -PversionName="$VERSION_NAME" \
            -Pglitchtip.dsn="${{ secrets.GLITCHTIP_DSN }}"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: sovereign-ledger-${{ env.VERSION_NAME }}
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/mapping/release/mapping.txt

      - name: Extract release notes from tag message
        # Convention: the annotated tag's message IS the release notes —
        # subject line + body. It feeds both the GitHub release body and
        # the Play "What's new" (en-US, hard 500-char limit).
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir -p whatsnew
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" | sed -e '/^-----BEGIN PGP SIGNATURE-----/,$d' > release-notes.md
          # Play: first 500 chars, trailing whitespace trimmed, never empty
          head -c 500 release-notes.md | sed -e 's/[[:space:]]*$//' > whatsnew/en-US
          [ -s whatsnew/en-US ] || printf 'Internal testing build.' > whatsnew/en-US
          echo "--- release notes (Play en-US, $(wc -c < whatsnew/en-US) chars) ---"
          cat whatsnew/en-US

      - name: Upload to Play internal testing
        # Non-fatal until the Play Console app entry exists — "Package not
        # found" here means: create the app in Console, then re-run the job.
        continue-on-error: true
        if: steps.secrets.outputs.play == 'true' && steps.secrets.outputs.keystore == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.sovereignledger.app
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
          whatsNewDirectory: whatsnew

      - name: Publish GitHub release (tag message + AAB)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" && exit 0
          gh release create "$GITHUB_REF_NAME" \
            --title "Sovereign Ledger $VERSION_NAME (build $VERSION_CODE)" \
            --notes-file release-notes.md \
            --verify-tag \
            app/build/outputs/bundle/release/app-release.aab \
            app/build/outputs/mapping/release/mapping.txt
