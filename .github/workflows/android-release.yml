name: Android Release

# Play Store pipeline — tag `app-v*` (matching version.xcconfig) →
#   signed release AAB → Google Play internal testing track.
#
# Required repository secrets (see docs/play-release.md):
#   ANDROID_KEYSTORE_BASE64   — base64 of the release .jks keystore
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
#   PLAY_SERVICE_ACCOUNT_JSON — Play Console service account JSON
#   EXCHANGE_SERVER_HOST — production backend hostname
#   EXCHANGE_SERVER_HOST_STG — staging backend hostname
#     Only the selected environment's host secret is required for a build.
#
# Optional repository secrets:
#   GLITCHTIP_DSN — production crash reporting; empty disables it.
#   GLITCHTIP_DSN_STG — staging crash reporting; never falls back to production.
#
# Signing: the runner materializes key.properties from the keystore
# secrets (same file format local builds use) — app/build.gradle.kts
# loads it at configuration time. Missing secrets → unsigned AAB
# artifact, Play upload skipped.
on:
  push:
    tags:
      - "app-v*"
  workflow_dispatch:
    inputs:
      track:
        description: "Play track: 'internal', or a closed-testing track name that already exists in Play Console"
        required: false
        default: internal
        type: string
      in_app_update_priority:
        description: "In-app update priority 0–5 — 4 or higher makes the app force a full-screen update"
        required: false
        default: "0"
        type: string
      staging_build:
        description: "Staging build: same app id/Play listing, staging host + launcher badge + '-staging' versionName"
        required: false
        default: "false"
        type: boolean

jobs:
  release:
    # Canonical repo only — forks don't carry the signing/Play secrets,
    # so a fork run could only produce an unsigned artifact. Skip forks
    # entirely (also saves the fork owner's Actions minutes).
    if: github.repository == 'liodali/ExchangeConvertApp'
    name: Build & upload AAB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Detect secrets
        id: secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PLAY_SA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then echo "keystore=true" >> "$GITHUB_OUTPUT"; fi
          if [ -n "$PLAY_SA" ]; then echo "play=true" >> "$GITHUB_OUTPUT"; fi

      - name: Materialize signing (keystore + key.properties)
        if: steps.secrets.outputs.keystore == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > "$HOME/release.keystore"
          # The build reads key.properties at configuration time (same file
          # as local builds use) — CI materializes it from secrets here.
          {
            echo "KEYSTORE_PATH=$HOME/release.keystore"
            echo "KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
            echo "KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}"
            echo "KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}"
          } > key.properties

      - name: Read shared app version
        env:
          PLAY_TRACK: ${{ inputs.track || 'internal' }}
          PLAY_PRIORITY: ${{ inputs.in_app_update_priority || '0' }}
          PLAY_STAGING_BUILD: ${{ inputs.staging_build || false }}
          PRODUCTION_SERVER_HOST: ${{ secrets.EXCHANGE_SERVER_HOST }}
          STAGING_SERVER_HOST: ${{ secrets.EXCHANGE_SERVER_HOST_STG }}
        run: |
          set -euo pipefail
          VERSION_ARGS=(--format android-env)
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION_ARGS+=(--tag "$GITHUB_REF_NAME")
          fi
          python3 script/app-version.py "${VERSION_ARGS[@]}" >> "$GITHUB_ENV"
          if ! [[ "$PLAY_PRIORITY" =~ ^[0-5]$ ]]; then
            echo "::error::in_app_update_priority must be 0–5 (got '$PLAY_PRIORITY')"
            exit 1
          fi
          echo "PLAY_TRACK=$PLAY_TRACK" >> "$GITHUB_ENV"
          echo "PLAY_UPDATE_PRIORITY=$PLAY_PRIORITY" >> "$GITHUB_ENV"
          # Same Play listing / applicationId for staging and release; -stg
          # tags and the manual switch choose APP_VARIANT=staging so the build
          # points at staging and carries launcher badge/-staging versionName.
          if [[ "$GITHUB_REF_TYPE" == "tag" && ( "$GITHUB_REF_NAME" == *-stg || "$GITHUB_REF_NAME" == *-stg+* ) ]] || [[ "$PLAY_STAGING_BUILD" == "true" ]]; then
            SERVER_HOST="${STAGING_SERVER_HOST:-}"
            HOST_SECRET=EXCHANGE_SERVER_HOST_STG
            echo "APP_VARIANT=staging" >> "$GITHUB_ENV"
            echo "AAB_PATH=app/build/outputs/bundle/staging/app-staging.aab" >> "$GITHUB_ENV"
            echo "MAPPING_PATH=app/build/outputs/mapping/staging/mapping.txt" >> "$GITHUB_ENV"
          else
            SERVER_HOST="${PRODUCTION_SERVER_HOST:-}"
            HOST_SECRET=EXCHANGE_SERVER_HOST
            echo "APP_VARIANT=release" >> "$GITHUB_ENV"
            echo "AAB_PATH=app/build/outputs/bundle/release/app-release.aab" >> "$GITHUB_ENV"
            echo "MAPPING_PATH=app/build/outputs/mapping/release/mapping.txt" >> "$GITHUB_ENV"
          fi
          if [[ -z "$SERVER_HOST" ]]; then
            echo "::error::Missing repository secret $HOST_SECRET; refusing to use a fallback."
            exit 1
          fi
          echo "SERVER_HOST=$SERVER_HOST" >> "$GITHUB_ENV"
          python3 script/app-version.py

      - name: Check version code against Google Play
        if: steps.secrets.outputs.play == 'true' && steps.secrets.outputs.keystore == 'true'
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          python3 -m pip install 'google-auth[requests]>=2,<3'
          python3 script/check-play-version.py

      - name: Build app bundle
        env:
          PRODUCTION_GLITCHTIP_DSN: ${{ secrets.GLITCHTIP_DSN }}
          STAGING_GLITCHTIP_DSN: ${{ secrets.GLITCHTIP_DSN_STG }}
        run: |
          set -euo pipefail
          if [[ "$APP_VARIANT" == "staging" ]]; then
            GRADLE_TASK=":app:bundleStaging"
            GLITCHTIP_DSN="${STAGING_GLITCHTIP_DSN:-}"
          else
            GRADLE_TASK=":app:bundleRelease"
            GLITCHTIP_DSN="${PRODUCTION_GLITCHTIP_DSN:-}"
          fi
          ./gradlew "$GRADLE_TASK" \
            -PversionCode="$VERSION_CODE" \
            -PversionName="$VERSION_NAME" \
            -Pglitchtip.dsn="$GLITCHTIP_DSN" \
            -Pserver.host="$SERVER_HOST"

      - name: Prepare release notes (whatsnew)
        # Notes live locally in the git-ignored whatsnew.xml (Play Console
        # multi-language format: <en-US>…</en-US> <de-DE>…</de-DE> …) and
        # become the tag message — nothing is committed per release:
        #   git tag -a app-vX.Y.Z+N -F whatsnew.xml
        # script/whatsnew.py splits the tag message into one file per
        # language (500-byte cap, UTF-8-safe). The full en-US block feeds
        # the GitHub release body. Legacy plain-text tag messages still
        # work (→ en-US only). Manual runs → fallback text.
        # Only languages configured in the Play Console listing may appear
        # in the blocks — unlisted languages fail the upload.
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            git tag -l --format='%(contents)' "$GITHUB_REF_NAME" | sed -e '/^-----BEGIN PGP SIGNATURE-----/,$d' > release-notes.md
          else
            : > release-notes.md
          fi
          python3 script/whatsnew.py release-notes.md --out whatsnew --github-body github-release-notes.md

      - name: Upload to Play
        # A rejected upload or rollout must fail the job. Track comes from
        # the derive step: tag runs default to internal, manual runs may
        # pick a closed-testing track via the `track` input.
        continue-on-error: false
        if: steps.secrets.outputs.play == 'true' && steps.secrets.outputs.keystore == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.sovereignledger.app
          releaseFiles: ${{ env.AAB_PATH }}
          tracks: ${{ env.PLAY_TRACK }}
          status: completed
          inAppUpdatePriority: ${{ env.PLAY_UPDATE_PRIORITY }}
          whatsNewDirectory: whatsnew

      - name: Write staging distribution links
        # Staging only. Internal testing and internal app sharing are separate
        # Play channels: the former is a stable opt-in URL; the latter's
        # download URL is issued by Play Console when an AAB is uploaded.
        if: env.APP_VARIANT == 'staging'
        env:
          APP_SHARING_URL: ${{ vars.PLAY_APP_SHARING_URL }}
        run: |
          {
            echo "## Staging distribution"
            echo
            echo "- **Internal testing (join/install):** https://play.google.com/apps/testing/com.sovereignledger.app"
            if [[ -n "$APP_SHARING_URL" ]]; then
              echo "- **Internal app sharing (direct test build):** $APP_SHARING_URL"
            else
              echo "- **Internal app sharing:** not configured yet."
              echo "  Upload this AAB in Play Console → Internal app sharing, then save its returned link as the \`PLAY_APP_SHARING_URL\` repo variable to show it here."
            fi
            echo
            echo "Backend: staging (configured via repository secret)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish GitHub release (tag message + AAB)
        # Publish only after all preceding steps have succeeded.
        if: startsWith(github.ref, 'refs/tags/') && success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" && exit 0
          gh release create "$GITHUB_REF_NAME" \
            --title "Dinarly $VERSION_NAME (build $VERSION_CODE)" \
            --notes-file github-release-notes.md \
            --verify-tag \
            "$AAB_PATH" \
            "$MAPPING_PATH"
