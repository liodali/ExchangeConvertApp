name: Android Release

# Play Store pipeline — tag `app-v*` (e.g. app-v1.0.0) →
#   signed release AAB → Google Play internal testing track.
#
# Required repository secrets (see docs/play-release.md):
#   ANDROID_KEYSTORE_BASE64   — base64 of the release .jks keystore
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
#   PLAY_SERVICE_ACCOUNT_JSON — Play Console service account JSON
# Missing secrets → the AAB is still built and attached as an artifact;
# the Play upload step is skipped.
on:
  push:
    tags:
      - "app-v*"
  workflow_dispatch:

jobs:
  release:
    name: Build & upload AAB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Detect secrets
        id: secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PLAY_SA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then echo "keystore=true" >> "$GITHUB_OUTPUT"; fi
          if [ -n "$PLAY_SA" ]; then echo "play=true" >> "$GITHUB_OUTPUT"; fi

      - name: Decode signing keystore
        if: steps.secrets.outputs.keystore == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > "$HOME/release.keystore"
          echo "SIGNING_KEYSTORE_PATH=$HOME/release.keystore" >> "$GITHUB_ENV"

      - name: Derive version from tag
        run: |
          VERSION_NAME="${GITHUB_REF_NAME#app-v}"
          # workflow_dispatch (no tag) falls back to a dev label
          if [ "$VERSION_NAME" = "${GITHUB_REF_NAME}" ]; then VERSION_NAME="1.0.0-dev.${GITHUB_RUN_NUMBER}"; fi
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Build release AAB
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew :app:bundleRelease \
            -PversionCode="$VERSION_CODE" \
            -PversionName="$VERSION_NAME"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: sovereign-ledger-${{ env.VERSION_NAME }}
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/mapping/release/mapping.txt

      - name: Upload to Play internal testing
        if: steps.secrets.outputs.play == 'true' && steps.secrets.outputs.keystore == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.sovereignledger.app
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
