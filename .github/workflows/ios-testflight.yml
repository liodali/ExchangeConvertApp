name: iOS → TestFlight (asc)

# Builds the iOS app on a macOS runner with the asc CLI:
#   Gradle (shared KMP framework, via the scheme pre-action)
#   → xcodebuild archive (Release, automatic signing via ASC API key)
#   → export IPA (app-store-connect)
#   → upload to App Store Connect / TestFlight
#
# Required repo secrets:
#   ASC_KEY_ID           App Store Connect API key id (e.g. PGFU8P8424)
#   ASC_ISSUER_ID        Issuer id (e.g. 5616a31a-2b14-4332-be86-eedd145346f8)
#   ASC_PRIVATE_KEY_B64  base64 of the AuthKey_<KEY_ID>.p8 file
# Optional:
#   ASC_APP_ID           App id (auto-resolved from the bundle id when empty)
#   TESTFLIGHT_GROUP     Beta group name — set to also distribute to testers
#   IOS_SECRETS_SWIFT_B64  base64 of iosApp/ExchangeConvertApp/Secrets.swift
#                          (when unset, the Xcode "Prepare Secrets" phase
#                           copies Secrets.swift.example — placeholder key)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Marketing version (empty = project MARKETING_VERSION)"
        required: false
        default: ""
      skip_upload:
        description: "Build & export only — do not upload to ASC"
        type: boolean
        default: false
  push:
    tags: ["ios-v*"]

concurrency:
  group: ios-testflight-${{ github.ref }}
  cancel-in-progress: false

env:
  BUNDLE_ID: dali.hamza.ExchangeConvertApp
  PROJECT: iosApp/ExchangeConvertApp.xcodeproj
  SCHEME: ExchangeConvertApp
  CONFIGURATION: Release
  ARTIFACTS: .asc/artifacts

jobs:
  build-and-upload:
    name: Archive, export, upload
    runs-on: macos-15
    timeout-minutes: 90

    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_APP_ID: ${{ secrets.ASC_APP_ID }}
      TESTFLIGHT_GROUP: ${{ secrets.TESTFLIGHT_GROUP }}
      # Team id for manual-signing export — not a secret (ships in every IPA).
      TEAM_ID: JL33N2APJT

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          sw_vers

      # Java for the Gradle pre-action that builds the shared KMP framework
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle (cached)
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      # Prebuilt shared framework (~90 MB, vs 2.5 GB for the whole build
      # dir). Exact-key hits let the scheme pre-action skip Gradle entirely;
      # deliberately NO restore-keys — a stale framework must never be used.
      - name: Cache shared framework artifact
        id: fwcache
        uses: actions/cache@v4
        with:
          path: shared/build/xcode-frameworks
          key: fw-${{ runner.os }}-${{ hashFiles('shared/src/**/*.kt', 'shared/src/**/*.sq', 'shared/build.gradle.kts', 'gradle/libs.versions.toml') }}

      - name: Install asc CLI
        run: |
          # install script first: serves the latest release. Homebrew lags
          # behind and older formula versions miss newer flags (e.g.
          # signing fetch --create-missing-certificate).
          if ! curl -fsSL https://asccli.sh/install | bash; then
            echo "::warning::install script failed — falling back to brew"
            HOMEBREW_NO_AUTO_UPDATE=1 brew install asc
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          asc version

      - name: App Store Connect auth (API key, headless)
        env:
          ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_PRIVATE_KEY_B64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc" "$ARTIFACTS"
          KEY="$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_PRIVATE_KEY_B64" | base64 -d > "$KEY"
          chmod 600 "$KEY" # asc rejects .p8 files with loose permissions
          asc auth login --bypass-keychain --name ci \
            --key-id "$ASC_KEY_ID" \
            --issuer-id "$ASC_ISSUER_ID" \
            --private-key "$KEY"
          asc auth status --validate

      - name: Inject Secrets.swift (runtime API key)
        env:
          IOS_SECRETS_SWIFT_B64: ${{ secrets.IOS_SECRETS_SWIFT_B64 }}
        run: |
          # secrets context is not resolvable in step `if:` — gate here
          if [ -z "$IOS_SECRETS_SWIFT_B64" ]; then
            echo "IOS_SECRETS_SWIFT_B64 not set — the Xcode 'Prepare Secrets'"
            echo "phase will copy the template; the build still succeeds."
            exit 0
          fi
          printf '%s' "$IOS_SECRETS_SWIFT_B64" | base64 -d \
            > iosApp/ExchangeConvertApp/Secrets.swift
          echo "Injected Secrets.swift from secret"

      - name: Resolve app id, version, and next build number
        id: ids
        run: |
          # --- app id (secret, or resolved from the bundle id) ------------
          APP_ID="$ASC_APP_ID"
          if [ -z "$APP_ID" ]; then
            APP_ID=$(asc apps list --bundle-id "$BUNDLE_ID" --output json --paginate 2>/dev/null | python3 -c '
              import json, sys
              d = json.load(sys.stdin)
              data = d.get("data") or []
              print(data[0]["id"] if data else "")
              ')
          fi
          [ -n "$APP_ID" ] || { echo "::error::No App Store Connect app for $BUNDLE_ID — run ios_cicd/add-app.sh first, or set the ASC_APP_ID secret"; exit 1; }

          # --- marketing version (input > tag > project) ------------------
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ] && [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#ios-v}"
          fi
          if [ -z "$VERSION" ]; then
            VERSION=$(grep -m1 'MARKETING_VERSION' "$PROJECT/project.pbxproj" \
              | sed -E 's/.*MARKETING_VERSION = ([0-9.]+).*/\1/')
          fi
          [ -n "$VERSION" ] || { echo "::error::Could not determine the version"; exit 1; }

          # --- next build number for this version -------------------------
          BUILD_NUMBER=$(asc builds next-build-number \
            --app "$APP_ID" --version "$VERSION" --platform IOS \
            --initial-build-number 1 --output json \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["nextBuildNumber"])')
          [ -n "$BUILD_NUMBER" ] || { echo "::error::Could not resolve the next build number"; exit 1; }

          echo "app_id=$APP_ID"        >> "$GITHUB_OUTPUT"
          echo "version=$VERSION"      >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "Resolved: app=$APP_ID version=$VERSION build=$BUILD_NUMBER"

      # Distribution identity persists across runs — fetch creates a cert
      # only once; the private key must survive or every run mints a new
      # cert and Apple allows only two.
      - name: Cache distribution identity
        uses: actions/cache@v4
        with:
          path: .asc/signing
          key: dist-identity-v1

      # -allowProvisioningUpdates requires an Apple ID account session on
      # this Xcode ("No Accounts") — API keys alone don't cut it. Provision
      # explicitly: fetch (or create) cert + profile, import the identity
      # into a dedicated keychain, stage the profile for xcodebuild.
      - name: Provision signing (cert + profile)
        run: |
          set -euo pipefail
          mkdir -p .asc/signing
          asc signing fetch \
            --bundle-id "$BUNDLE_ID" \
            --profile-type IOS_APP_STORE \
            --output .asc/signing \
            --create-missing --create-missing-certificate \
            --force
          CER=$(ls .asc/signing/*.cer | head -n 1)
          KEY=.asc/signing/distribution.key
          PROFILE=$(ls .asc/signing/*.mobileprovision | head -n 1)

          # Rebuild the p12 with the SYSTEM LibreSSL: asc's p12 (and any
          # OpenSSL 3.x one) uses AES-256/SHA-256 PKCS12 that macOS
          # `security import` rejects with -25264. LibreSSL emits the
          # legacy encoding Apple's importer accepts.
          P12_PASS=$(/usr/bin/openssl rand -hex 16)
          KC_PASS=$(/usr/bin/openssl rand -hex 16)
          KC="$RUNNER_TEMP/ci.keychain-db"
          /usr/bin/openssl pkcs12 -export \
            -in "$CER" -inkey "$KEY" \
            -out "$RUNNER_TEMP/ci.p12" -passout "pass:$P12_PASS" \
            -name "CI Apple Distribution"
          security create-keychain -p "$KC_PASS" "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr '\n' ' ')
          security import "$RUNNER_TEMP/ci.p12" -P "$P12_PASS" -k "$KC" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PASS" "$KC" >/dev/null 2>&1
          rm -f "$RUNNER_TEMP/ci.p12"

          asc profiles local install --path "$PROFILE" --force
          security cms -D -i "$PROFILE" > /tmp/profile.plist
          UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' /tmp/profile.plist)
          NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' /tmp/profile.plist)
          echo "PROFILE_UUID=$UUID" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$NAME" >> "$GITHUB_ENV"
          security find-identity -p codesigning "$KC"

      - name: Archive (Release · generic/iOS · manual signing)
        env:
          VERSION: ${{ steps.ids.outputs.version }}
          BUILD_NUMBER: ${{ steps.ids.outputs.build_number }}
          # 'true' only on an exact framework-cache hit — the scheme
          # pre-action then restores the framework and skips Gradle
          ASC_FW_CACHE_HIT: ${{ steps.fwcache.outputs.cache-hit }}
        run: |
          KEY="$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8"
          asc xcode archive \
            --project "$PROJECT" \
            --scheme "$SCHEME" \
            --configuration "$CONFIGURATION" \
            --archive-path "$ARTIFACTS/ExchangeConvertApp.xcarchive" \
            --clean --overwrite \
            --output json \
            --xcodebuild-flag=-destination \
            --xcodebuild-flag=generic/platform=iOS \
            --xcodebuild-flag=CODE_SIGN_STYLE=Manual \
            --xcodebuild-flag=PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            --xcodebuild-flag=PROVISIONING_PROFILE="$PROFILE_UUID" \
            --xcodebuild-flag=CODE_SIGN_IDENTITY="Apple Distribution" \
            --xcodebuild-flag=MARKETING_VERSION="$VERSION" \
            --xcodebuild-flag=CURRENT_PROJECT_VERSION="$BUILD_NUMBER"

      - name: Export IPA (app-store-connect)
        run: |
          asc xcode export \
            --archive-path "$ARTIFACTS/ExchangeConvertApp.xcarchive" \
            --ipa-path "$ARTIFACTS/ExchangeConvertApp.ipa" \
            --method app-store-connect \
            --signing-style manual \
            --team-id "$TEAM_ID" \
            --overwrite --timeout 15m \
            --output json

      - name: Upload to App Store Connect / TestFlight
        if: ${{ inputs.skip_upload != true }}
        env:
          APP_ID: ${{ steps.ids.outputs.app_id }}
        run: |
          if [ -n "$TESTFLIGHT_GROUP" ]; then
            echo "Publishing to TestFlight group: $TESTFLIGHT_GROUP"
            asc publish testflight \
              --app "$APP_ID" \
              --ipa "$ARTIFACTS/ExchangeConvertApp.ipa" \
              --group "$TESTFLIGHT_GROUP" \
              --wait --output json
          else
            asc builds upload \
              --app "$APP_ID" \
              --ipa "$ARTIFACTS/ExchangeConvertApp.ipa" \
              --wait --output json
          fi

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExchangeConvertApp-${{ steps.ids.outputs.version }}-${{ steps.ids.outputs.build_number }}
          path: |
            .asc/artifacts/ExchangeConvertApp.ipa
            .asc/artifacts/ExchangeConvertApp.xcarchive/dSYMs
          if-no-files-found: error

      - name: Summary
        if: always()
        env:
          APP_ID: ${{ steps.ids.outputs.app_id }}
          VERSION: ${{ steps.ids.outputs.version }}
          BUILD_NUMBER: ${{ steps.ids.outputs.build_number }}
        run: |
          {
            echo "## iOS build — ${{ job.status }}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| App | \`$BUNDLE_ID\` (id \`$APP_ID\`) |"
            echo "| Version | \`$VERSION\` build \`$BUILD_NUMBER\` |"
            echo "| Artifact | Actions artifact \`ExchangeConvertApp-$VERSION-$BUILD_NUMBER\` |"
            echo ""
            echo "TestFlight: https://appstoreconnect.apple.com/apps/$APP_ID/testflight"
          } >> "$GITHUB_STEP_SUMMARY"
