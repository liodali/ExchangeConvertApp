name: iOS → TestFlight (asc)

# Builds the iOS app on a macOS runner with the asc CLI:
#   Gradle (shared KMP framework, via the scheme pre-action)
#   → xcodebuild archive (Release, manual signing with a CI identity)
#   → export IPA (app-store-connect)
#   → upload to App Store Connect / TestFlight
#
# Required repo secrets:
#   ASC_KEY_ID           App Store Connect API key id (e.g. PGFU8P8424)
#   ASC_ISSUER_ID        Issuer id (e.g. 5616a31a-2b14-4332-be86-eedd145346f8)
#   ASC_PRIVATE_KEY_B64  base64 of the AuthKey_<KEY_ID>.p8 file
#   IOS_DISTRIBUTION_KEY_B64  base64 of the distribution private key (PEM)
#   IOS_DISTRIBUTION_CERT_ID  ASC certificate id created from that key’s CSR
# Optional:
#   RUNNER_READ_TOKEN    Fine-grained PAT for this repo with Administration: read
#                        (needed to prefer the self-hosted Mac automatically)
#   ASC_APP_ID           App id (auto-resolved from the bundle id when empty)
#   TESTFLIGHT_GROUP     Beta group name — set to also distribute to testers
#   IOS_SECRETS_SWIFT_B64  base64 of iosApp/ExchangeConvertApp/Secrets.swift
#                          (when unset, the Xcode "Prepare Secrets" phase
#                           copies Secrets.swift.example — placeholder key)

on:
  workflow_dispatch:
    inputs:
      skip_upload:
        description: "Build & export only — do not upload to ASC"
        type: boolean
        default: false
  push:
    tags: ["ios-v*"]

concurrency:
  group: ios-testflight-signing
  cancel-in-progress: false

env:
  BUNDLE_ID: dali.hamza.ExchangeConvertApp
  PROJECT: iosApp/ExchangeConvertApp.xcodeproj
  SCHEME: ExchangeConvertApp
  CONFIGURATION: Release
  ARTIFACTS: .asc/artifacts
  # S3-compatible cache backend (GarageHQ on the OVH VPS). Set as repo
  # VARIABLES: S3_CACHE_ENDPOINT (https://s3.example.tld), S3_CACHE_BUCKET.
  # Credentials: S3_CACHE_KEY_ID / S3_CACHE_SECRET secrets. When unset,
  # the workflow falls back to GitHub's 10GB cache (LRU + tag-ref scoping).
  S3_CACHE_ENDPOINT: ${{ vars.S3_CACHE_ENDPOINT }}
  S3_CACHE_BUCKET: ${{ vars.S3_CACHE_BUCKET }}

jobs:
  select-runner:
    name: Select available iOS runner
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    outputs:
      runner: ${{ steps.select.outputs.runner }}
    steps:
      - name: Check self-hosted Mac availability
        id: select
        uses: actions/github-script@v7
        env:
          RUNNER_READ_TOKEN: ${{ secrets.RUNNER_READ_TOKEN }}
        with:
          github-token: ${{ secrets.RUNNER_READ_TOKEN || github.token }}
          script: |
            const hosted = ['macos-26'];
            const selfHosted = ['self-hosted', 'macOS', 'ARM64', 'exchange-mac'];
            let selected = hosted;
            if (!process.env.RUNNER_READ_TOKEN) {
              core.warning('RUNNER_READ_TOKEN is not configured; using the paid GitHub-hosted macOS runner.');
            } else {
              try {
                const runners = await github.paginate(github.rest.actions.listSelfHostedRunnersForRepo, {
                  ...context.repo,
                  per_page: 100,
                  request: { timeout: 10000 },
                });
                const requiredLabels = selfHosted.map(label => label.toLowerCase());
                const available = runners.some(runner => {
                  const labels = new Set((runner.labels || []).map(label => label.name.toLowerCase()));
                  return runner.name === 'ExchangeMacRunner' && runner.status === 'online' && runner.busy === false
                    && requiredLabels.every(label => labels.has(label));
                });
                if (available) selected = selfHosted;
              } catch (error) {
                core.warning(`Runner availability check failed (status ${error.status || 'unknown'}); using GitHub-hosted macOS.`);
              }
            }
            core.setOutput('runner', JSON.stringify(selected));
            core.info(`Selected iOS runner: ${selected.join(', ')}`);

  build-and-upload:
    name: Archive, export, upload
    needs: select-runner
    # Prefer the idle local Mac; otherwise use GitHub's Xcode 26+ image.
    # Selection is a snapshot: a subsequent disconnect can still queue the job.
    runs-on: ${{ fromJSON(needs.select-runner.outputs.runner) }}
    timeout-minutes: 90

    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_APP_ID: ${{ secrets.ASC_APP_ID }}
      TESTFLIGHT_GROUP: ${{ secrets.TESTFLIGHT_GROUP }}
      # Team id for manual-signing export — not a secret (ships in every IPA).
      TEAM_ID: 47TCTNRU75
      # 'true' when the Garage S3 cache credentials exist. Step `if:` may
      # not reference the secrets context — evaluate it here instead.
      S3_CACHE_ENABLED: ${{ secrets.S3_CACHE_KEY_ID != '' && 'true' || 'false' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare isolated signing directory
        run: |
          set -euo pipefail
          umask 077
          SIGNING_DIR=$(mktemp -d "$RUNNER_TEMP/exchangeconvert-signing-XXXXXX")
          echo "CI_SIGNING_DIR=$SIGNING_DIR" >> "$GITHUB_ENV"
          echo "ASC_CONFIG_PATH=$SIGNING_DIR/asc-config.json" >> "$GITHUB_ENV"

      - name: Show toolchain
        run: |
          xcodebuild -version
          sw_vers

      # Java for the Gradle pre-action that builds the shared KMP framework
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle (cached)
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Kotlin/Native toolchain
        if: env.S3_CACHE_ENABLED == 'false'
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      # Prebuilt shared framework + Compose resources (~91 MB, vs 2.5 GB for
      # the whole build dir). Exact-key hits let the scheme pre-action skip
      # Gradle entirely; deliberately NO restore-keys — a stale framework
      # must never be used. v2: added the compose resource tree the fast
      # path was missing (fonts — crashes at launch without them).
      - name: Cache shared framework artifact
        if: env.S3_CACHE_ENABLED == 'false'
        id: fwcache
        uses: actions/cache@v4
        with:
          path: |
            shared/build/xcode-frameworks
            shared/build/generated/compose/resourceGenerator
          key: fw2-${{ runner.os }}-${{ hashFiles('shared/src/**/*.kt', 'shared/src/**/*.sq', 'shared/build.gradle.kts', 'gradle/libs.versions.toml') }}

      # --- S3/Garage cache path (preferred when credentials exist) --------
      # Same content as the two actions/cache steps above, but stored on our
      # own GarageHQ bucket: no 10GB repo ceiling, no LRU eviction races with
      # the Android workflow, and caches saved by TAG builds stay restorable
      # (GitHub's cache scopes tag refs — every release rebuilds cold there).
      - name: Restore build caches (S3/Garage)
        id: s3cache
        if: env.S3_CACHE_ENABLED == 'true'
        # cache problems must NEVER block a release — a dead restore
        # degrades to a cold Gradle build via the empty outputs
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_CACHE_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_CACHE_SECRET }}
          AWS_ENDPOINT_URL: ${{ vars.S3_CACHE_ENDPOINT }}
          AWS_DEFAULT_REGION: garage
        run: |
          set -uo pipefail
          KONAN_KEY="konan2/${RUNNER_OS}/${{ hashFiles('gradle/libs.versions.toml') }}"
          FW_KEY="fw3/${RUNNER_OS}/${{ hashFiles('shared/src/**/*.kt', 'shared/src/**/*.sq', 'shared/build.gradle.kts', 'gradle/libs.versions.toml') }}"
          echo "konan_key=$KONAN_KEY" >> "$GITHUB_OUTPUT"
          echo "fw_key=$FW_KEY" >> "$GITHUB_OUTPUT"
          aws configure set default.s3.addressing_style path

          # Garage quirk: `aws s3 ls` on a missing prefix exits 1 (AWS S3
          # exits 0 with empty output) — every ls must be failure-tolerant
          # or the runner's bash -e aborts the step silently.
          s3_has() { { aws s3 ls "s3://${S3_CACHE_BUCKET}/$1/" 2>/dev/null || true; } | grep -q .; }

          # konan: exact hit, else the newest older prefix (the KN toolchain
          # accumulates versions — a stale tarball still saves a full download)
          KONAN_SRC=""
          if s3_has "$KONAN_KEY"; then
            KONAN_SRC="$KONAN_KEY"
          else
            KONAN_SRC=$( { aws s3 ls "s3://${S3_CACHE_BUCKET}/konan2/${RUNNER_OS}/" 2>/dev/null || true; } \
              | awk '{print $2}' | sed 's:/$::' | sort | tail -1)
            if [ -n "$KONAN_SRC" ]; then
              echo "konan: exact key miss, falling back to $KONAN_SRC"
            fi
          fi
          if [ -n "$KONAN_SRC" ]; then
            aws s3 cp "s3://${S3_CACHE_BUCKET}/${KONAN_SRC}/konan.tgz" "$RUNNER_TEMP/konan.tgz" \
              && tar -xzf "$RUNNER_TEMP/konan.tgz" -C "$HOME" && rm -f "$RUNNER_TEMP/konan.tgz" \
              && echo "konan=hit" >> "$GITHUB_OUTPUT" \
              || echo "konan restore failed — continuing cold"
          fi

          # framework: EXACT key only — a stale framework must never be used
          # (same discipline as the actions/cache variant)
          if s3_has "$FW_KEY"; then
            if aws s3 cp "s3://${S3_CACHE_BUCKET}/${FW_KEY}/fw.tgz" "$RUNNER_TEMP/fw.tgz" \
              && tar -xzf "$RUNNER_TEMP/fw.tgz" -C . && rm -f "$RUNNER_TEMP/fw.tgz"; then
              echo "fw=hit" >> "$GITHUB_OUTPUT"
            else
              echo "framework restore failed — Gradle will rebuild"
            fi
          fi
          echo "restore summary: konan=$(grep -o 'konan=.*' "$GITHUB_OUTPUT" | tail -1 || echo miss) fw=$(grep -o 'fw=.*' "$GITHUB_OUTPUT" | head -1 || echo miss)"

      - name: Install asc CLI
        run: |
          # Reuse the installed CLI on the persistent runner.
          if command -v asc >/dev/null 2>&1; then
            asc version
            exit 0
          fi
          # Self-hosted: reuse the machine's asc instead of reinstalling.
          if command -v asc >/dev/null 2>&1; then
            asc version
            exit 0
          fi
          # install script first: serves the latest release. Homebrew lags
          # behind and older formula versions miss newer flags (e.g.
          # signing fetch --create-missing-certificate).
          if ! curl -fsSL https://asccli.sh/install | bash; then
            echo "::warning::install script failed — falling back to brew"
            HOMEBREW_NO_AUTO_UPDATE=1 brew install asc
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          asc version

      - name: App Store Connect auth (API key, headless)
        env:
          ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_PRIVATE_KEY_B64 }}
        run: |
          umask 077
          mkdir -p "$CI_SIGNING_DIR/asc" "$ARTIFACTS"
          KEY="$CI_SIGNING_DIR/asc/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_PRIVATE_KEY_B64" | base64 -d > "$KEY"
          chmod 600 "$KEY" # asc rejects .p8 files with loose permissions
          # NOTE: asc's --local writes an empty ./.asc that then SHADOWS the
          # global config for every later asc call in this workspace — do not
          # use it. Wipe any stale one instead, then register globally.
          rm -rf .asc
          asc auth login --bypass-keychain --name ci \
            --key-id "$ASC_KEY_ID" \
            --issuer-id "$ASC_ISSUER_ID" \
            --private-key "$KEY"
          asc auth status --validate

      - name: Inject Secrets.swift (runtime API key)
        env:
          IOS_SECRETS_SWIFT_B64: ${{ secrets.IOS_SECRETS_SWIFT_B64 }}
        run: |
          # Secrets.swift is a declared compile source but is NOT declared
          # as an output of the "Prepare Secrets" phase — the build graph
          # therefore requires it to exist BEFORE xcodebuild starts (it
          # exists locally from earlier Xcode builds; on a fresh runner it
          # must be created here).
          if [ -n "$IOS_SECRETS_SWIFT_B64" ]; then
            printf '%s' "$IOS_SECRETS_SWIFT_B64" | base64 -d \
              > iosApp/ExchangeConvertApp/Secrets.swift
            echo "Injected Secrets.swift from secret"
          else
            cp iosApp/ExchangeConvertApp/Secrets.swift.example \
               iosApp/ExchangeConvertApp/Secrets.swift
            echo "Copied Secrets.swift template (no secret set)"
          fi

      - name: Resolve app id and read shared app version
        id: ids
        run: |
          # --- app id (secret, or resolved from the bundle id) ------------
          APP_ID="$ASC_APP_ID"
          if [ -z "$APP_ID" ]; then
            APP_ID=$(asc apps list --bundle-id "$BUNDLE_ID" --output json --paginate 2>/dev/null | python3 -c '
              import json, sys
              d = json.load(sys.stdin)
              data = d.get("data") or []
              print(data[0]["id"] if data else "")
              ')
          fi
          [ -n "$APP_ID" ] || { echo "::error::No App Store Connect app for $BUNDLE_ID — run ios_cicd/add-app.sh first, or set the ASC_APP_ID secret"; exit 1; }

          # Both platforms read the same committed version/build number.
          VERSION_ARGS=()
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION_ARGS+=(--tag "$GITHUB_REF_NAME")
          fi
          python3 script/app-version.py --format ios-output "${VERSION_ARGS[@]}" >> "$GITHUB_OUTPUT"
          echo "app_id=$APP_ID" >> "$GITHUB_OUTPUT"
          python3 script/app-version.py

      # Load the stable identity from secrets; asc manages its profile.
      - name: Load distribution certificate and private key
        env:
          IOS_DISTRIBUTION_KEY_B64: ${{ secrets.IOS_DISTRIBUTION_KEY_B64 }}
          IOS_DISTRIBUTION_CERT_ID: ${{ secrets.IOS_DISTRIBUTION_CERT_ID }}
        run: |
          set -euo pipefail
          umask 077
          [ -n "$IOS_DISTRIBUTION_KEY_B64" ] && [ -n "$IOS_DISTRIBUTION_CERT_ID" ] \
            || { echo "::error::Set IOS_DISTRIBUTION_KEY_B64 and IOS_DISTRIBUTION_CERT_ID repository secrets"; exit 1; }
          KEY="$CI_SIGNING_DIR/distribution.key"
          CER="$CI_SIGNING_DIR/distribution.cer"
          CERT_ID="$IOS_DISTRIBUTION_CERT_ID"
          printf '%s' "$IOS_DISTRIBUTION_KEY_B64" | base64 -d > "$KEY"
          /usr/bin/openssl pkey -in "$KEY" -noout >/dev/null 2>&1 \
            || { echo "::error::IOS_DISTRIBUTION_KEY_B64 must contain a base64-encoded, unencrypted PEM private key"; exit 1; }
          printf '%s' "$CERT_ID" > "$CI_SIGNING_DIR/certificate-id"
          echo "Using distribution certificate $CERT_ID"
          asc certificates view --id "$CERT_ID" --output json > "$CI_SIGNING_DIR/certificate.json"
          python3 - "$CI_SIGNING_DIR/certificate.json" "$CER" <<'PYTHON'
          import base64, datetime, json, pathlib, sys
          attrs = json.load(open(sys.argv[1]))["data"]["attributes"]
          if attrs.get("certificateType") not in ("DISTRIBUTION", "IOS_DISTRIBUTION"):
              raise SystemExit("Expected an Apple/iOS distribution certificate")
          expiry = attrs.get("expirationDate")
          if not expiry or datetime.datetime.fromisoformat(expiry.replace("Z", "+00:00")) <= datetime.datetime.now(datetime.timezone.utc):
              raise SystemExit("Distribution certificate has expired; replace the signing secrets")
          pathlib.Path(sys.argv[2]).write_bytes(base64.b64decode(attrs["certificateContent"], validate=True))
          PYTHON
          /usr/bin/openssl x509 -inform DER -in "$CER" -out "$CI_SIGNING_DIR/cert.pem"
          CER="$CI_SIGNING_DIR/cert.pem"
          CERT_PUBLIC_KEY=$(/usr/bin/openssl x509 -in "$CER" -pubkey -noout)
          KEY_PUBLIC_KEY=$(/usr/bin/openssl pkey -in "$KEY" -pubout)
          [ "$CERT_PUBLIC_KEY" = "$KEY_PUBLIC_KEY" ] \
            || { echo "::error::Distribution certificate does not match the cached private key"; exit 1; }

      - name: Create provisioning profile and install signing identity
        run: |
          set -euo pipefail
          KEY="$CI_SIGNING_DIR/distribution.key"
          CER="$CI_SIGNING_DIR/cert.pem"
          CERT_ID=$(cat "$CI_SIGNING_DIR/certificate-id")
          PROFILE="$CI_SIGNING_DIR/AppStore.mobileprovision"

          BUNDLE_RESOURCE_ID=$(asc bundle-ids list --identifier "$BUNDLE_ID" --paginate --output json \
            | python3 -c 'import json,sys; d=json.load(sys.stdin)["data"]; assert len(d)==1, "Expected one bundle ID"; print(d[0]["id"])')

          # Create a profile owned by this run. Never delete other profiles
          # for the bundle, including profiles used by local Xcode builds.
          asc profiles create --name "ExchangeConvertApp-CI-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --profile-type IOS_APP_STORE --bundle "$BUNDLE_RESOURCE_ID" \
            --certificate "$CERT_ID" --output json > "$CI_SIGNING_DIR/created-profile.json"
          PROFILE_ID=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["data"]["id"])' \
            "$CI_SIGNING_DIR/created-profile.json")
          rm -f "$PROFILE"
          asc profiles download --id "$PROFILE_ID" --output "$PROFILE"

          # Rebuild the p12 with the SYSTEM LibreSSL: asc's p12 (and any
          # OpenSSL 3.x one) uses AES-256/SHA-256 PKCS12 that macOS
          # `security import` rejects with -25264. LibreSSL emits the
          # legacy encoding Apple's importer accepts.
          P12_PASS=$(/usr/bin/openssl rand -hex 16)
          KC_PASS=$(/usr/bin/openssl rand -hex 16)
          KC="$CI_SIGNING_DIR/ci.keychain-db"
          /usr/bin/openssl pkcs12 -export \
            -in "$CER" -inkey "$KEY" \
            -out "$CI_SIGNING_DIR/ci.p12" -passout "pass:$P12_PASS" \
            -name "CI Apple Distribution"
          security create-keychain -p "$KC_PASS" "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          # -t only: no lock-on-sleep — the machine may doze during the long
          # Gradle phase and a locked keychain kills codesign with
          # errSecInternalComponent.
          security set-keychain-settings -t 21600 "$KC"
          python3 .github/scripts/ios-signing-state.py keychain-add
          # Apple's WWDR intermediates: preinstalled on GitHub's runner
          # images, ABSENT on self-hosted Macs — without them the chain
          # cannot build, find-identity sees nothing, and codesign dies
          # with errSecInternalComponent. Import into the CI keychain.
          curl -sfL -o "$CI_SIGNING_DIR/wwdr-g3.cer" https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer
          curl -sfL -o "$CI_SIGNING_DIR/wwdr-g4.cer" https://www.apple.com/certificateauthority/AppleWWDRCAG4.cer
          security import "$CI_SIGNING_DIR/wwdr-g3.cer" -k "$KC"
          security import "$CI_SIGNING_DIR/wwdr-g4.cer" -k "$KC"
          security import "$CI_SIGNING_DIR/ci.p12" -P "$P12_PASS" -k "$KC" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASS" "$KC"
          # expose keychain + password to the archive step for its pre-flight
          # unlock (session state cannot be trusted across a 13-min Gradle
          # build; the runner is a single-user machine so this stays local)
          echo "CI_KEYCHAIN=$KC"               >> "$GITHUB_ENV"
          printf 'CI_KEYCHAIN_PASS=%s\n' "$KC_PASS" >> "$GITHUB_ENV"
          security find-identity -p codesigning "$KC"
          rm -f "$CI_SIGNING_DIR/ci.p12"

          security cms -D -i "$PROFILE" > "$CI_SIGNING_DIR/profile.plist"
          python3 .github/scripts/ios-signing-state.py profiles-install "$PROFILE"
          UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$CI_SIGNING_DIR/profile.plist")
          NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$CI_SIGNING_DIR/profile.plist")
          echo "PROFILE_UUID=$UUID" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$NAME" >> "$GITHUB_ENV"
          security find-identity -p codesigning "$KC"
          rm -f "$KEY"

      - name: Archive (Release · generic/iOS · manual signing)
        env:
          VERSION: ${{ steps.ids.outputs.version }}
          BUILD_NUMBER: ${{ steps.ids.outputs.build_number }}
          # 'true' on an exact framework-cache hit (GitHub cache OR S3/Garage)
          # — the scheme pre-action then restores the framework and skips Gradle
          ASC_FW_CACHE_HIT: ${{ (steps.fwcache.outputs.cache-hit == 'true' || steps.s3cache.outputs.fw == 'hit') && 'true' || '' }}
        run: |
          # Pre-flight: the signing keychain may have re-locked (session
          # state is not trustworthy across the Gradle phase) — unlock and
          # ASSERT the identity before spending 15 minutes building.
          if [ -n "${CI_KEYCHAIN:-}" ]; then
            security unlock-keychain -p "$CI_KEYCHAIN_PASS" "$CI_KEYCHAIN"
            security find-identity -p codesigning "$CI_KEYCHAIN" | grep -q "Apple Distribution" \
              || { echo "::error::distribution identity missing from the CI keychain"; exit 1; }
          fi
          KEY="$CI_SIGNING_DIR/asc/AuthKey_${ASC_KEY_ID}.p8"
          asc xcode archive \
            --project "$PROJECT" \
            --scheme "$SCHEME" \
            --configuration "$CONFIGURATION" \
            --archive-path "$ARTIFACTS/ExchangeConvertApp.xcarchive" \
            --overwrite \
            --output json \
            --xcodebuild-flag=-destination \
            --xcodebuild-flag=generic/platform=iOS \
            --xcodebuild-flag=-derivedDataPath \
            --xcodebuild-flag="$RUNNER_TEMP/xcode-dd" \
            --xcodebuild-flag=CODE_SIGN_STYLE=Manual \
            --xcodebuild-flag=PROVISIONING_PROFILE="$PROFILE_UUID" \
            --xcodebuild-flag=CODE_SIGN_IDENTITY="Apple Distribution" \
            --xcodebuild-flag=MARKETING_VERSION="$VERSION" \
            --xcodebuild-flag=CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            --xcodebuild-flag=COMPILER_INDEX_STORE_ENABLE=NO

      # The cache fast path restores the framework but NOT the Compose
      # resources (the Gradle embed task normally copies them into the .app).
      # Without them the theme's fonts throw MissingResourceException at
      # launch. Stage them into the archived app; export re-signs after.
      - name: Stage Compose resources into archive
        run: |
          APP_IN_ARCHIVE="$ARTIFACTS/ExchangeConvertApp.xcarchive/Products/Applications/ExchangeConvertApp.app"
          if [ -d "$APP_IN_ARCHIVE/compose-resources" ]; then
            echo "compose-resources already present (full Gradle build)"
            exit 0
          fi
          RES=$(ls -d shared/build/generated/compose/resourceGenerator/assembledResources/iosArm64*/composeResources 2>/dev/null | head -n 1)
          [ -n "$RES" ] || { echo "::error::compose resources missing — the app would crash at launch without fonts"; exit 1; }
          mkdir -p "$APP_IN_ARCHIVE/compose-resources"
          cp -R "$RES" "$APP_IN_ARCHIVE/compose-resources/"
          echo "staged $(basename "$(dirname "$RES")") compose resources into the archive app"

      # Persist what the Gradle pre-action produced (it runs INSIDE the
      # Archive step above, hence save-after-archive). Fire-and-forget:
      # a cache save failure must never fail a release.
      - name: Save build caches (S3/Garage)
        if: env.S3_CACHE_ENABLED == 'true' && steps.s3cache.outputs.fw != 'hit'
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_CACHE_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_CACHE_SECRET }}
          AWS_ENDPOINT_URL: ${{ vars.S3_CACHE_ENDPOINT }}
          AWS_DEFAULT_REGION: garage
          # Compute keys independently: restore can fail before emitting outputs.
          KONAN_KEY: konan2/${{ runner.os }}/${{ hashFiles('gradle/libs.versions.toml') }}
          FW_KEY: fw3/${{ runner.os }}/${{ hashFiles('shared/src/**/*.kt', 'shared/src/**/*.sq', 'shared/build.gradle.kts', 'gradle/libs.versions.toml') }}
        run: |
          set -euo pipefail
          # never save under empty keys — a restore step that died early
          # leaves them unset (that's how an fw.tgz landed at the bucket
          # root on the first attempt)
          if [ -z "${FW_KEY:-}" ] || [ -z "${KONAN_KEY:-}" ]; then
            echo "::warning::cache keys missing (restore did not complete) — skipping save"
            exit 0
          fi
          aws configure set default.s3.addressing_style path
          mkdir -p "$RUNNER_TEMP/s3cache"
          # framework only exists when Gradle actually built it (fw miss)
          if ls shared/build/xcode-frameworks/"$CONFIGURATION"/*/shared.framework >/dev/null 2>&1; then
            tar -czf "$RUNNER_TEMP/s3cache/fw.tgz" \
              shared/build/xcode-frameworks \
              shared/build/generated/compose/resourceGenerator
            aws s3 cp "$RUNNER_TEMP/s3cache/fw.tgz" "s3://${S3_CACHE_BUCKET}/${FW_KEY}/fw.tgz" --no-progress
            rm -f "$RUNNER_TEMP/s3cache/fw.tgz"
            echo "saved framework → ${FW_KEY}"
          fi
          # konan: skip when restored this run; save only newly downloaded toolchains
          if [ "${{ steps.s3cache.outputs.konan }}" != "hit" ] && [ -d "$HOME/.konan" ]; then
            tar -czf "$RUNNER_TEMP/s3cache/konan.tgz" -C "$HOME" .konan
            aws s3 cp "$RUNNER_TEMP/s3cache/konan.tgz" "s3://${S3_CACHE_BUCKET}/${KONAN_KEY}/konan.tgz" --no-progress
            rm -f "$RUNNER_TEMP/s3cache/konan.tgz"
            echo "saved konan → ${KONAN_KEY}"
          fi

      - name: Export IPA (app-store-connect)
        run: |
          asc xcode export \
            --archive-path "$ARTIFACTS/ExchangeConvertApp.xcarchive" \
            --ipa-path "$ARTIFACTS/ExchangeConvertApp.ipa" \
            --method app-store-connect \
            --signing-style manual \
            --team-id "$TEAM_ID" \
            --overwrite --timeout 15m \
            --output json

      - name: Upload to App Store Connect / TestFlight
        if: ${{ inputs.skip_upload != true }}
        env:
          APP_ID: ${{ steps.ids.outputs.app_id }}
        run: |
          if [ -n "$TESTFLIGHT_GROUP" ]; then
            echo "Publishing to TestFlight group: $TESTFLIGHT_GROUP"
            asc publish testflight \
              --app "$APP_ID" \
              --ipa "$ARTIFACTS/ExchangeConvertApp.ipa" \
              --group "$TESTFLIGHT_GROUP" \
              --wait --output json
          else
            asc builds upload \
              --app "$APP_ID" \
              --ipa "$ARTIFACTS/ExchangeConvertApp.ipa" \
              --wait --output json
          fi

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExchangeConvertApp-${{ steps.ids.outputs.version }}-${{ steps.ids.outputs.build_number }}
          path: |
            .asc/artifacts/ExchangeConvertApp.ipa
            .asc/artifacts/ExchangeConvertApp.xcarchive/dSYMs
          if-no-files-found: error

      - name: Clean up CI signing resources
        if: always()
        run: |
          set -euo pipefail
          [ -n "${CI_SIGNING_DIR:-}" ] && [ -d "$CI_SIGNING_DIR" ] || exit 0
          # Delete only the remote profile whose creation receipt this run owns.
          if [ -s "$CI_SIGNING_DIR/created-profile.json" ]; then
            if PROFILE_ID=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["data"]["id"])' \
              "$CI_SIGNING_DIR/created-profile.json"); then
              asc profiles delete --id "$PROFILE_ID" --confirm \
                || echo "::warning::Could not delete CI profile $PROFILE_ID; local cleanup will continue"
            else
              echo "::warning::Invalid CI profile receipt; local cleanup will continue"
            fi
          fi
          rm -f "$CI_SIGNING_DIR/distribution.key" "$CI_SIGNING_DIR/ci.p12" \
            "$CI_SIGNING_DIR/asc/AuthKey_${ASC_KEY_ID}.p8" "$CI_SIGNING_DIR/asc-config.json"
          python3 .github/scripts/ios-signing-state.py cleanup
          rm -rf "$CI_SIGNING_DIR"

      - name: Summary
        if: always()
        env:
          APP_ID: ${{ steps.ids.outputs.app_id }}
          VERSION: ${{ steps.ids.outputs.version }}
          BUILD_NUMBER: ${{ steps.ids.outputs.build_number }}
        run: |
          {
            echo "## iOS build — ${{ job.status }}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| App | \`$BUNDLE_ID\` (id \`$APP_ID\`) |"
            echo "| Version | \`$VERSION\` build \`$BUILD_NUMBER\` |"
            echo "| Artifact | Actions artifact \`ExchangeConvertApp-$VERSION-$BUILD_NUMBER\` |"
            echo ""
            echo "TestFlight: https://appstoreconnect.apple.com/apps/$APP_ID/testflight"
          } >> "$GITHUB_STEP_SUMMARY"
